name: Price alerts

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub can run a few minutes late)
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test alert to the phone?"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check prices and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        run: python checker/check_prices.py
